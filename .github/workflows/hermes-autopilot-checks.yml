name: Hermes Autopilot Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-autopilot-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HERMES_DATA_DIR: ${{ runner.temp }}/hermes-data
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate policy files
        run: |
          python -m json.tool policies/growth_policy.json > /dev/null
          python -m json.tool config.json > /dev/null

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Compile Python packages
        run: python -m compileall -q backend core hermes_growth llm oracle_v1 tests

      - name: Run ecosystem audit when available
        shell: bash
        run: |
          if [ -f scripts/check_ecosystem.py ]; then
            python scripts/check_ecosystem.py --strict
          fi

      - name: Verify no tracked runtime state
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(cloud_unlock\.json|credit_guard\.log|skill_registry\.json|promotions\.jsonl)$'; then
            echo "Mutable runtime state must remain outside source control."
            exit 1
          fi
